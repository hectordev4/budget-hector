<form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="user-form-container">
  
  <!-- Name Input Control -->
  <div class="form-group">
    <label for="name">Nom:</label>
    <input 
      id="name" 
      type="text" 
      formControlName="name" 
      placeholder="Introdueix el teu nom"
    />
    @if (userForm.get('name')?.invalid && userForm.get('name')?.touched) {
      <small class="error-text">El nom és obligatori.</small>
    }
  </div>

  <!-- Email Input Control -->
  <div class="form-group">
    <label for="email">Email:</label>
    <input 
      id="email" 
      type="email" 
      formControlName="email" 
      placeholder="Introdueix el teu email"
    />
    @if (userForm.get('email')?.invalid && userForm.get('email')?.touched) {
      <small class="error-text">Introdueix un email vàlid.</small>
    }
  </div>

  <!-- Phone Input Control -->
  <div class="form-group">
    <label for="phone">Telèfon:</label>
    <input 
      id="phone" 
      type="tel" 
      formControlName="phone" 
      placeholder="Introdueix el teu telèfon"
    />
    @if (userForm.get('phone')?.invalid && userForm.get('phone')?.touched) {
      <small class="error-text">El telèfon és obligatori.</small>
    }
  </div>

  <!-- Submit Action Button -->
  <button 
    type="submit" 
    [disabled]="userForm.invalid" 
    class="submit-btn">
    Sol·licitar Pressupost
  </button>

</form>
