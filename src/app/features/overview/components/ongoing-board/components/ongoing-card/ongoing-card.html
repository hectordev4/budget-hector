<app-generic-card
  [title]="quote().clientName"
  [description]="quote().clientEmail + ' | ' + quote().clientPhone"
  [price]="quote().totalPrice"
  [showCheckbox]="false">

  <mat-card-content class="history-drawer">
    <div class="history-meta">
      <span class="quote-date-tag">
        Created on: {{ quote().date.toLocaleDateString() }}
      </span>
      
      <a [routerLink]="['/pressupost', quoteHash()]" target="_blank" class="detail-link-btn">
        View details
        <mat-icon>open_in_new</mat-icon>
      </a>
    </div>

    <div class="services-summary">
      <span class="summary-tagline">Contracted Services:</span>
      <ul class="summary-list">
        @for (service of quote().services; track service.name) {
          <li class="summary-item">
            <span class="item-name">{{ service.name }}</span>
            @if (service.details) {
              <span class="item-details">({{ service.details }})</span>
            }
          </li>
        }
      </ul>
    </div>
  </mat-card-content>

</app-generic-card>
