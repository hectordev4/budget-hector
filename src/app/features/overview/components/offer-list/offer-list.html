<section class="offers-container-grid">
  @for (offer of offers(); track offer.id) {
    <app-generic-card
      [title]="offer.title"
      [description]="offer.description"
      [price]="offer.price"
      [isSelected]="!!activeSelections()[offer.id]"
      (selectionChange)="toggleSelection(offer, $event)">

      <!-- Projecting custom counter panel into the mat-card-content slot -->
      @if (offer.hasOptions && activeSelections()[offer.id]) {
        <mat-card-content class="accordion-panel">
          
          <!-- Pages Counter Row -->
          <div class="counter-row">
            <div class="label-with-modal">
              <span class="counter-label">Nombre de pàgines</span>
              <button mat-icon-button type="button" class="info-trigger-btn" (click)="openHelp('pages')">
                <mat-icon>info</mat-icon>
              </button>
            </div>
            <div class="counter-controls">
              <button mat-mini-fab type="button" class="action-count-btn" (click)="updatePages(offer, -1)">-</button>
              <span class="counter-value">{{ getPages(offer.id) }}</span>
              <button mat-mini-fab type="button" class="action-count-btn" (click)="updatePages(offer, 1)">+</button>
            </div>
          </div>

          <!-- Languages Counter Row -->
          <div class="counter-row">
            <div class="label-with-modal">
              <span class="counter-label">Nombre de llenguatges</span>
              <button mat-icon-button type="button" class="info-trigger-btn" (click)="openHelp('languages')">
                <mat-icon>info</mat-icon>
              </button>
            </div>
            <div class="counter-controls">
              <button mat-mini-fab type="button" class="action-count-btn" (click)="updateLanguages(offer, -1)">-</button>
              <span class="counter-value">{{ getLanguages(offer.id) }}</span>
              <button mat-mini-fab type="button" class="action-count-btn" (click)="updateLanguages(offer, 1)">+</button>
            </div>
          </div>

        </mat-card-content>
      }

    </app-generic-card>
  }
</section>
