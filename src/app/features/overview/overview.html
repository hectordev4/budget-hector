<section class="overview-container">
  
  @if (offers().length === 0) {
    <div class="loading-spinner">
      <p>Carregant ofertes...</p>
    </div>
  } @else {
    <section class="cards-list">
      <!-- Passing our data models downward into our decoupled feature sub-layer -->
      <app-offer-list 
        [offers]="offers()"
        [activeSelections]="activeSelections()"
        (offerStateChange)="handleOfferStateChange($event)">
      </app-offer-list>
    </section>
  }
  
  <app-budget-summary [total]="totalBudget()"></app-budget-summary>
  <app-user-form (formSubmit)="onUserFormSubmit($event)"></app-user-form>

  <hr class="section-divider" />
  
  <app-ongoing-board></app-ongoing-board>

</section>
