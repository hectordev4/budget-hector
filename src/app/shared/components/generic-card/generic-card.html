<mat-card [class.card-selected]="isSelected()" class="custom-service-card" role="region" [attr.aria-label]="'Servei de ' + title()">
  <div class="card-layout-wrapper">
    
    <div class="card-main-content">
      <mat-card-header>
        <mat-card-title>{{ title() }}</mat-card-title>
      </mat-card-header>
      <mat-card-subtitle>{{ description() }}</mat-card-subtitle>

      <ng-content select="mat-card-content"></ng-content>
    </div>

    <div class="card-action-sidebar">
      <span class="price-display" [attr.aria-label]="'Preu: ' + price() + ' euros'">{{ price() }}€</span>
      
      @if (showCheckbox()) {
        <mat-checkbox 
          [checked]="isSelected()" 
          (change)="toggleSelection()"
          class="custom-card-checkbox"
          [attr.aria-label]="'Seleccionar el servei de ' + title()">
          Afegir
        </mat-checkbox>
      }
    </div>

  </div>
</mat-card>
